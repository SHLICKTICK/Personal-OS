<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a0a"/>
      <stop offset="50%" stop-color="#0a1414"/>
      <stop offset="100%" stop-color="#050a0a"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Dark Container -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="102" fill="none" stroke="#00f5a0" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Command Circuit Grid Substrate -->
  <circle cx="256" cy="256" r="170" fill="url(#coreGrad)" stroke="#00f5a0" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#00d2ff" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Terminal Command Prompt Glyphs '>_' -->
  <!-- Stylized Terminal Chevron '>' -->
  <path d="M 180 180 L 250 256 L 180 332" fill="none" stroke="url(#neonGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Terminal Prompt Underscore cursor '_' -->
  <line x1="275" y1="332" x2="345" y2="332" stroke="#00f5a0" stroke-width="28" stroke-linecap="round" filter="url(#glow)"/>

  <!-- OS Pulse Node Points -->
  <circle cx="256" cy="116" r="7" fill="#00f5a0" filter="url(#glow)"/>
  <circle cx="256" cy="396" r="7" fill="#00d2ff" filter="url(#glow)"/>
  <circle cx="116" cy="256" r="7" fill="#00d2ff" filter="url(#glow)"/>
  <circle cx="396" cy="256" r="7" fill="#00f5a0" filter="url(#glow)"/>
</svg>
